# MANUAL LOCAL TEST REFERENCE: no hosted runtime or deployment evidence.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai-trace-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_trace
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-trace-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ai-trace-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/ai_trace
      - REDIS_URL=redis://redis:6379/0
      - MIGRATE_ON_START=true
      - API_AUTH_ENABLED=${API_AUTH_ENABLED:-true}
      - API_REQUIRE_TENANT_HEADER=${API_REQUIRE_TENANT_HEADER:-true}
      - API_KEYS=${API_KEYS:-replace-me:local-operator:viewer|operator|admin:acme}
      - BROWSER_SESSION_COOKIE_SECURE=${BROWSER_SESSION_COOKIE_SECURE:-false}
      - OBSERVABILITY_SCHEDULER_ENABLED=false
      - OBSERVABILITY_SCHEDULER_RUN_DETECTORS=false
      - OBSERVABILITY_SCHEDULER_RUN_POLICIES=false
      - OBSERVABILITY_SCHEDULER_EXECUTE_POLICY_ACTIONS=false
      - OBSERVABILITY_SCHEDULER_ENABLE_NOTIFICATIONS=false
      - OBSERVABILITY_SCHEDULER_ORG_IDS=
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=5).close()"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
