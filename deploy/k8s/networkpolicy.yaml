# FROZEN MANUAL REFERENCE: not applied by this repository and not deployment evidence.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ai-trace-api
  namespace: ai-trace-internal
spec:
  podSelector:
    matchLabels:
      app: ai-trace-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ai-trace-internal
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
