apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-trace-api
  namespace: ai-trace-prod
  labels:
    app: ai-trace-api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ai-trace-api
  template:
    metadata:
      labels:
        app: ai-trace-api
    spec:
      serviceAccountName: default
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values: ["ai-trace-api"]
              topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: ghcr.io/asquitt/agent-trace:main
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ai-trace-secrets
                  key: database_url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ai-trace-secrets
                  key: redis_url
            - name: API_AUTH_ENABLED
              value: "true"
            - name: API_REQUIRE_TENANT_HEADER
              value: "true"
            - name: API_RATE_LIMIT_ENABLED
              value: "true"
            - name: API_RATE_LIMIT_MAX_KEYS
              value: "100000"
            - name: OBSERVABILITY_SCHEDULER_ENABLED
              value: "true"
            - name: OBSERVABILITY_SCHEDULER_ENABLE_NOTIFICATIONS
              value: "false"
            - name: OBSERVABILITY_SCHEDULER_LEASE_SECONDS
              value: "30"
            - name: OBSERVABILITY_SCHEDULER_ORG_IDS
              valueFrom:
                configMapKeyRef:
                  name: ai-trace-runtime-config
                  key: scheduler_org_ids
            - name: PREFLIGHT_ON_START
              value: "true"
            - name: PREFLIGHT_STRICT
              value: "true"
            - name: MIGRATE_ON_START
              value: "false"
          envFrom:
            - secretRef:
                name: ai-trace-api-keys
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: tmp
          emptyDir: {}
