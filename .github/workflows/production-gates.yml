name: Manual Internal Component Gates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: Manual repository validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Security Gate
        run: ./scripts/security_gate.sh

      - name: Backup/Restore Drill
        run: ./scripts/backup_restore_drill.sh

      - name: Performance Gate
        run: ./scripts/run_perf_gate.sh

      - name: Record immutable evidence scope
        if: always()
        run: |
          mkdir -p docs/reports
          cat > docs/reports/EVIDENCE_SCOPE.txt <<EOF
          evidence_scope=manual_repository_validation
          production_evidence=false
          repository=${GITHUB_REPOSITORY}
          source_sha=${GITHUB_SHA}
          workflow_ref=${GITHUB_WORKFLOW_REF}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          EOF

      - name: Upload gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-component-gate-reports-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            docs/reports/EVIDENCE_SCOPE.txt
            docs/reports/security/**
            docs/reports/dr/**
            docs/reports/perf/**
