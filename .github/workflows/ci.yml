name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_trace
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ai_trace"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_trace
      DATABASE_ECHO: "false"
      API_AUTH_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check --select F src tests

      - name: Type-check
        run: pyright

      - name: Migrations
        run: alembic upgrade head

      - name: Migration Replay
        run: |
          alembic downgrade 001
          alembic upgrade head

      - name: Test
        run: pytest -q -p pytest_cov -p pytest_asyncio
